name: Keep Supabase awake

# Free Supabase projects pause after about a week without activity.
# This runs a tiny check every 3 days so sign-ups keep saving between launches.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the funnel database
        run: |
          curl -fsS -X POST "https://atmiwjkgqmdsrocuuozv.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_pjk4c2DdIzm_1rf3L1xgfw_BSlJfzTR" \
            -H "Content-Type: application/json" -d '{}'
